services:
  atlas:
    image: mongodb/mongodb-atlas-local:latest
    container_name: incident-swarm-atlas
    # 27017 is commonly taken by another local mongo; this demo uses 27018 on the host.
    ports:
      - "27018:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: swarm
      MONGODB_INITDB_ROOT_PASSWORD: swarm
    volumes:
      - atlas-data:/data/db
      - atlas-config:/data/configdb
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username=swarm
        - --password=swarm
        - --authenticationDatabase=admin
        - --eval
        - "db.runCommand('ping').ok"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  atlas-data:
  atlas-config:
